<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4d1a"/>
      <stop offset="55%" stop-color="#2d7a2d"/>
      <stop offset="100%" stop-color="#5cb85c"/>
    </linearGradient>
    <pattern id="iconPattern" width="220" height="220" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <g fill="#ffffff" opacity="0.06">
        
        <path d="M14 52 C14 30 30 14 50 14 C70 14 86 30 86 52 L86 56 L14 56 Z"/>
        <rect x="6" y="56" width="88" height="10" rx="3"/>
        <rect x="34" y="66" width="32" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="4"/>
        <line x1="42" y1="76" x2="58" y2="76" stroke="#ffffff" stroke-width="3"/>
    
      </g>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#iconPattern)"/>

  <!-- Franja institucional SENA -->
  <rect x="0" y="0" width="1920" height="10" fill="#ffffff" opacity="0.55"/>
  <rect x="0" y="1070" width="1920" height="10" fill="#ffffff" opacity="0.55"/>

  <!-- Icono grande decorativo -->
  <g transform="translate(1330,300) scale(4.4)" opacity="0.16" fill="#ffffff">
    
        <path d="M14 52 C14 30 30 14 50 14 C70 14 86 30 86 52 L86 56 L14 56 Z"/>
        <rect x="6" y="56" width="88" height="10" rx="3"/>
        <rect x="34" y="66" width="32" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="4"/>
        <line x1="42" y1="76" x2="58" y2="76" stroke="#ffffff" stroke-width="3"/>
    
  </g>

  <!-- Marca de agua institucional -->
  <text x="70" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#ffffff" opacity="0.55" letter-spacing="3">
    SERVICIO NACIONAL DE APRENDIZAJE - SENA
  </text>
  <text x="70" y="960" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#ffffff" opacity="0.85">
    Panel de Contratista - SENA
  </text>
</svg>
